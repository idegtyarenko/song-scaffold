name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, publish a Pages deployment, prove who we are.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheap and unambiguous, so they answer before the test run does.
      - run: npm run format:check

      - run: npm run lint

      # The sequence generator and the session cursor are the method itself; a broken
      # ladder should never reach the practice room. Runs the per-file coverage floors too,
      # which fail the build on a module that arrived without any tests at all.
      - run: npm test

      - run: npm run build

      # Pages itself is enabled on the repository, not from here: the workflow token is
      # not permitted to create the site (`enablement: true` fails with "Resource not
      # accessible by integration").
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
